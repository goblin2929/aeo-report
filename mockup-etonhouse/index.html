<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EtonHouse China Immersion: proposed site structure (wireframe)</title>
<style>
:root{--teal:#017A8C;--teal2:#E8F4F6;--ink:#1A1A2E;--grey:#5B6670;--line:#D5DCE2;--wf:#E9ECEF;--wf2:#D7DCE1;--wf3:#C4CBD2;--new:#FFF4E0;--newb:#E0A23B;--b2:#F1F2F4;--live:#EAF4EA}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#F7F9FA}
a{color:var(--teal)}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;position:sticky;top:0;z-index:20}
.tt{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px}.brand span{color:var(--teal)}
.notice{font-size:12.5px;color:var(--grey);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--teal);color:#fff}
main{padding:22px 24px 60px;max-width:1500px;margin:0 auto}
/* sitemap */
.homes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:8px}
.col h3{font-size:14px;color:var(--teal);margin:0 0 8px}
.box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.box:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(1,122,140,.15)}
.box.new{background:var(--new);border-color:var(--newb)}
.box.dim{opacity:.32}
.box .t{font-weight:600;font-size:13.5px}.box .u{font-size:11.5px;color:var(--grey);word-break:break-all}
.box .m{font-size:11.5px;color:var(--teal);font-weight:600;margin-top:3px}
.box .q{font-size:11.5px;font-style:italic;color:#46515B;margin-top:2px}
.homes .box{width:300px}.homes .box.main{width:380px;background:var(--teal);color:#fff;border-color:var(--teal)}
.homes .box.main .u,.homes .box.main .m,.homes .box.main .q{color:#E6F4F6}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.b1{background:#D8EFE0;color:#1E6B3A}.b2{background:#E6E8EB;color:#4A545E}.bn{background:var(--new);color:#8A5A00;border:1px solid var(--newb)}
.enqbar{margin:14px auto 0;max-width:820px;text-align:center;border:2px solid var(--teal);border-radius:10px;padding:9px;background:#fff;cursor:pointer}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--grey);margin:14px 0 4px}
.intro{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;line-height:1.45}
/* page view */
.ph{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.ph h1{font-size:22px;margin:4px 0 2px}.ph .u{color:var(--grey);font-size:13px;word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--teal2);color:#0B5C69;border-radius:14px;padding:3px 9px;font-size:12px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:#33404A}
.kv b{color:var(--ink)}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px}
.nav2 a{cursor:pointer;text-decoration:none}
.split2{display:grid;grid-template-columns:minmax(0,auto) minmax(320px,1fr);gap:18px;align-items:start}
.framewrap{display:flex;justify-content:center}
.frame{background:#fff;border:1px solid var(--wf3);border-radius:10px;overflow:hidden;position:relative}
.frame.desk{width:860px}.frame.mob{width:380px;border-radius:26px;border-width:8px;border-color:#2B2F33}
.blk{position:relative;border-bottom:1px solid #fff;cursor:pointer}
.blk:hover,.blk.on{outline:3px solid var(--teal);outline-offset:-3px;z-index:2}
.num{position:absolute;top:6px;left:6px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px;z-index:3}
.lab{font-size:12px;font-weight:600;color:#3A444D;padding:8px 10px 8px 34px}
.ph1{background:var(--wf);}.ph2{background:var(--wf2)}
.row{display:flex;gap:8px;padding:0 10px 10px}
.mob .row{flex-direction:column}
.card{flex:1;background:#fff;border:1px dashed var(--wf3);border-radius:6px;min-height:70px;padding:6px}
.card i{display:block;height:7px;background:var(--wf2);border-radius:3px;margin:5px 0;width:80%}
.card i:nth-child(2){width:60%}
.img{background:repeating-linear-gradient(45deg,#D9DEE3,#D9DEE3 8px,#E3E7EB 8px,#E3E7EB 16px);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#76818A;font-size:11px}
.lines i{display:block;height:8px;background:#CDD3D9;border-radius:3px;margin:7px 0;width:90%}.lines i:nth-child(2){width:70%}.lines i:nth-child(3){width:80%}
.tbl{margin:0 10px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.mob .tbl{grid-template-columns:repeat(3,1fr)}
.tbl span{background:#fff;height:16px;border-radius:2px}.tbl span.h{background:#BFC7CE}
.navbar{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 34px;background:#fff;border-bottom:1px solid var(--wf2)}
.logo{width:90px;height:22px;background:var(--wf3);border-radius:4px}
.pill{height:10px;width:52px;background:var(--wf2);border-radius:5px}
.btn{height:22px;width:66px;border-radius:11px;background:#9FB3BB}
.btn.t{background:var(--teal)}
.sp{flex:1}
.crumbbar{padding:6px 10px 6px 34px;font-size:11px;color:#8A949D;background:#fff}
.footer{background:#3E464D;color:#C9D0D6}.footer .lab{color:#E3E7EA}
.sticky{background:#fff;border-top:2px solid var(--teal);display:flex;gap:8px;padding:10px 10px 10px 34px}
.desk .sticky{opacity:.45}
.hero .img{height:200px;margin:0 10px 10px}.mob .hero .img{height:170px}
.notes{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 0;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:90px}
.note{padding:10px 14px;border-left:4px solid transparent;cursor:pointer}
.note.on{background:var(--teal2);border-left-color:var(--teal)}
.note h4{margin:0 0 3px;font-size:13.5px}.note h4 em{font-style:normal;color:var(--teal);margin-right:6px}
.note .w{font-size:12.5px;color:#33404A;margin:2px 0}.note .y{font-size:12.5px;color:#0B5C69;margin:4px 0 0}
.note .y b{color:var(--teal)}
.go{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline}
@media (max-width:1100px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}.split2{grid-template-columns:1fr}.notes{position:static;max-height:none}.frame.desk{width:100%}}
@media (max-width:640px){main{padding:14px}.cols{grid-template-columns:1fr 1fr}.homes .box,.homes .box.main{width:100%}.frame.mob{width:100%}}
</style>
</head>
